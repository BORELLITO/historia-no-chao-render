name: HNC descoberta de ativos (publico, leitura)
on:
  push:
    branches: ["main"]
    paths: ["run/descobrir.json"]
permissions:
  contents: read
jobs:
  d:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 voz/descobrir.py run/descobrir_q.json
